<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>銀座プランニング｜デザインB 確認用</title><style>html,body,iframe{margin:0;width:100%;border:0;display:block}body{overflow-x:hidden}</style></head>
<body><iframe title="銀座プランニング デザインB" src="ginpla.html"></iframe><script>
const frame=document.querySelector('iframe');
const css=`body{background:#f1f2f2}.draft{background:#c81e3a!important;font-size:0!important;letter-spacing:.12em!important}.draft:after{content:'デザインB｜確認用・未公開（掲載内容は現行LPのままです）';font-size:11px}.brand-header{border-bottom-color:#d8d8d8!important}.hero{min-height:670px!important;background:#101010!important}.hero:after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,10,12,.92),rgba(8,10,12,.71) 45%,rgba(8,10,12,.18) 78%)}.hero-inner{max-width:1040px!important;padding:46px 64px!important}.hero h1,.hero p.sub,.hero p.sub2{color:#fff!important;text-shadow:none!important}.hero h1{font-size:clamp(46px,5.3vw,74px)!important;font-weight:500!important;letter-spacing:.08em!important}.hero p.sub2{color:rgba(255,255,255,.8)!important}.hero .cta{background:#c81e3a!important;border-radius:0!important;box-shadow:none!important}.hero-dots{justify-content:flex-end!important;padding-right:64px!important}.section-title:before{width:36px!important}.block{border-radius:0!important;border-top:3px solid #1c1c1c!important;box-shadow:none!important}.cta-block{background:#101010!important}@media(max-width:640px){.hero{min-height:560px!important}.hero:after{background:linear-gradient(180deg,rgba(8,10,12,.82),rgba(8,10,12,.72) 58%,rgba(8,10,12,.28))}.hero-inner{padding:28px 26px!important}.hero h1{font-size:clamp(36px,11vw,52px)!important}.hero-dots{justify-content:center!important;padding:0!important}}`;
frame.addEventListener('load',()=>{const doc=frame.contentDocument;const style=doc.createElement('style');style.textContent=css;doc.head.append(style);const second=doc.querySelectorAll('.hero-slide')[1];if(second){doc.querySelector('.hero-slide.is-active')?.classList.remove('is-active');second.classList.add('is-active')}doc.title='銀座プランニング｜デザインB 確認用';const fit=()=>frame.style.height=doc.documentElement.scrollHeight+'px';fit();new ResizeObserver(fit).observe(doc.body)});
</script></body></html>
