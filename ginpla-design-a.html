<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>銀座プランニング｜デザインA 確認用</title><style>html,body,iframe{margin:0;width:100%;border:0;display:block}body{overflow-x:hidden}</style></head>
<body><iframe title="銀座プランニング デザインA" src="ginpla.html"></iframe><script>
const frame=document.querySelector('iframe');
const css=`body{background:#f6f5f2}.draft{background:#1b1b1b!important;font-size:11px!important;letter-spacing:.12em!important}.draft{font-size:0!important}.draft:after{content:'デザインA｜確認用・未公開（掲載内容は現行LPのままです）';font-size:11px}.brand-header{background:rgba(255,255,255,.88)!important}.hero{min-height:650px!important;background:#d8d3cc!important}.hero:after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,.94),rgba(255,255,255,.66) 44%,rgba(255,255,255,.04) 72%)}.hero-inner{padding:42px!important;max-width:1040px!important}.hero h1{max-width:11ch;font-size:clamp(46px,5vw,72px)!important;letter-spacing:.06em!important;text-shadow:none!important}.hero p.sub,.hero p.sub2{max-width:34ch;text-shadow:none!important}.hero .cta{box-shadow:0 14px 28px -16px rgba(0,0,0,.7)!important}.section-title{margin-top:72px!important}.block{border-radius:0!important;background:rgba(255,255,255,.94)!important}.cta-block{background:#171717!important}@media(max-width:640px){.hero{min-height:560px!important}.hero:after{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.76) 60%,rgba(255,255,255,.25))}.hero-inner{padding:26px!important}.hero h1{font-size:clamp(36px,11vw,52px)!important}}`;
frame.addEventListener('load',()=>{const doc=frame.contentDocument;const style=doc.createElement('style');style.textContent=css;doc.head.append(style);doc.title='銀座プランニング｜デザインA 確認用';const fit=()=>frame.style.height=doc.documentElement.scrollHeight+'px';fit();new ResizeObserver(fit).observe(doc.body)});
</script></body></html>
